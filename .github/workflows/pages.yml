# Build the static site and publish it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job installs and runs third-party code (npm packages): it can read the repository and nothing else. Only
# the deploy job, which runs no project code, may publish to Pages and ask for the identity token that needs.
permissions:
  contents: read

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit (the tag in the comment): a tag can be moved, a commit cannot. Dependabot keeps the
# pins current (.github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    # (configure-pages reads the site's Pages settings)
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # content, manifest, GLB and URL tests (no browser needed)
      - run: npm test
      # typecheck + vite build into dist/ (relative base, works under /<repo>/)
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
