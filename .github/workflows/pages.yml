# Build the static site and publish it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job installs and runs third-party code (npm packages): it can read the repository and nothing else. Only
# the deploy job, which runs no project code, may publish to Pages and ask for the identity token that needs.
permissions:
  contents: read

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit (the tag in the comment): a tag can be moved, a commit cannot. Dependabot keeps the
# pins current (.github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    # (configure-pages reads the site's Pages settings)
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # content, manifest, GLB and URL tests (no browser needed)
      - run: npm test
      # typecheck + vite build into dist/ (relative base, works under /<repo>/)
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
